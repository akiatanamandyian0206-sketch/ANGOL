<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f8">
  <title>A Little Garden</title>
  <style>
    :root {
      --ink: #713e55;
      --accent: #d9799c;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top))
               max(12px, env(safe-area-inset-right))
               max(12px, env(safe-area-inset-bottom))
               max(12px, env(safe-area-inset-left));
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(ellipse at center, #fff 0%, #fff9fb 43%, #fbe9ef 100%);
    }

    .garden {
      position: relative;
      width: min(100%, 1000px);
      height: min(88vh, 760px);
      height: min(88svh, 760px);
      min-height: 340px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .message-card {
      position: relative;
      z-index: 2;
      width: clamp(220px, 62%, 560px);
      min-height: clamp(150px, 26vh, 240px);
      padding: clamp(20px, 4vw, 46px);
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px solid rgba(217, 121, 156, .28);
      border-radius: clamp(18px, 3vw, 30px);
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 15px 45px rgba(159, 91, 119, .12);
      backdrop-filter: blur(5px);
      overflow-wrap: anywhere;
    }

    #message {
      margin: 0;
      max-width: 100%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: clamp(1.25rem, 4vw, 2.6rem);
      line-height: 1.35;
      font-weight: normal;
    }

    .decoration {
      position: absolute;
      z-index: 1;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      animation: drift var(--duration, 7s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
      transform: rotate(var(--rotation, 0deg));
      filter: drop-shadow(0 3px 3px rgba(120, 70, 90, .10));
    }

    .heart { color: #e88baa; font-family: Arial, sans-serif; }
    .flower { width: var(--size, 34px); height: var(--size, 34px); }

    @keyframes drift {
      from { translate: 0 -4px; }
      to { translate: 0 6px; }
    }

    /* Phones */
    @media (max-width: 600px) {
      .garden {
        width: 100%;
        height: 88svh;
        min-height: 320px;
      }
      .message-card {
        width: 68%;
        min-height: 150px;
        padding: 22px 16px;
      }
      #message { font-size: clamp(1.15rem, 5vw, 1.8rem); }
    }

    /* Tablets */
    @media (min-width: 601px) and (max-width: 1024px) {
      .garden {
        width: 96%;
        height: 86svh;
      }
      .message-card { width: 64%; }
      #message { font-size: clamp(1.7rem, 3.5vw, 2.5rem); }
    }

    /* Short landscape screens */
    @media (max-height: 500px) {
      .garden { height: 94svh; min-height: 260px; }
      .message-card { min-height: 125px; padding: 16px; }
      #message { font-size: clamp(1.1rem, 4vh, 1.8rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .decoration { animation: none; }
    }
  </style>
</head>
<body>
  <main class="garden" id="garden" aria-label="A decorative garden with a message">
    <section class="message-card">
      <h1 id="message"></h1>
    </section>
  </main>

  <script>
    const MESSAGE = "Hawooo bwabyy, HAPPYY BIRTHDAYYY,  it's youw sweet 16 napo ngayon bwaby and I know you've worked hard for everything bwaby, you sacrifice everything to make everyone happy happy my lovely bwaby. Disregard the people who keeps downing you my bwaby omkay? Just keep being your small pretty self madam bwaby kopow, I love you so so so much my one and only bwaby, my cutie patootie, have a wonderful birthday my one and only bwaby, always remember that you always have someone caring for you and want you to do your best and keep doing that, I LOVE YOUUUUUUUUUUU SOW SOW SOWOWOWOWOWOWO MACHHHHHOOOOOO MOREEEE";

    const DECORATION_COUNT = 84;

    document.getElementById("message").textContent = MESSAGE;

    const garden = document.getElementById("garden");

    const lily = `
      <svg class="flower" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="#fffafd" stroke="#e7a6c0" stroke-width="2">
          <ellipse cx="50" cy="29" rx="13" ry="27"/>
          <ellipse cx="50" cy="29" rx="13" ry="27" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="29" rx="13" ry="27" transform="rotate(120 50 50)"/>
          <ellipse cx="50" cy="29" rx="13" ry="27" transform="rotate(180 50 50)"/>
          <ellipse cx="50" cy="29" rx="13" ry="27" transform="rotate(240 50 50)"/>
          <ellipse cx="50" cy="29" rx="13" ry="27" transform="rotate(300 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="8" fill="#e9bd67"/>
        <g stroke="#c99b48" stroke-width="2" stroke-linecap="round">
          <path d="M50 47 L43 33 M50 47 L57 33 M50 47 L50 29"/>
        </g>
      </svg>`;

    const tulip = `
      <svg class="flower" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 43 C28 20 17 36 27 59 C33 73 44 74 50 64 C56 74 67 73 73 59 C83 36 72 20 50 43Z"
          fill="#e98da9" stroke="#cc6d8d" stroke-width="2"/>
        <path d="M50 62 Q48 79 50 94" fill="none" stroke="#6f9d76" stroke-width="5" stroke-linecap="round"/>
        <path d="M49 79 Q29 65 27 82 Q37 91 49 84" fill="#8dbb91"/>
        <path d="M51 86 Q70 67 76 83 Q66 94 51 91" fill="#79aa80"/>
      </svg>`;

    for (let i = 0; i < DECORATION_COUNT; i++) {
      const item = document.createElement("span");
      const isHeart = i % 3 === 0;
      const angle = i * 2.399963;
      const radius = 105 + (i % 7) * 29 + Math.floor(i / 7) * 3;
      const x = 50 + Math.cos(angle) * radius / 9;
      const y = 50 + Math.sin(angle) * radius / 6.3;

      item.className = "decoration " + (isHeart ? "heart" : "flower");
      item.style.left = `${Math.max(2, Math.min(94, x))}%`;
      item.style.top = `${Math.max(2, Math.min(92, y))}%`;
      item.style.setProperty("--size", `${15 + (i % 4) * 6}px`);
      item.style.setProperty("--duration", `${5 + (i % 6)}s`);
      item.style.setProperty("--delay", `${-(i % 8)}s`);
      item.style.setProperty("--rotation", `${(i * 31) % 50 - 25}deg`);

      if (isHeart) {
        item.textContent = "♥";
        item.style.fontSize = `${12 + (i % 4) * 4}px`;
      } else {
        item.innerHTML = i % 2 === 0 ? lily : tulip;
      }
      garden.appendChild(item);
    }
  </script>
</body>
</html>
